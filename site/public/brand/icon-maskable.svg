<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ThemeAves">
  <title>ThemeAves</title>
  <!--
    Maskable source. The same silhouette as favicon.svg at 68% of its size, so
    the whole bird sits inside the 80% safe circle that Android and any other
    masking platform may crop to. The field is full bleed and square with no
    corner radius: the mask cuts the plane, and the platform supplies whatever
    corner it wants.

    Do not use this file as the favicon. At tab size the safe-zone padding
    throws away the pixels the bird needs.
  -->
  <rect width="32" height="32" fill="#243D59"/>
  <g fill="#FFFFFF" transform="translate(6.82 8.802) scale(0.027393) translate(670.25 0) scale(-1 1) translate(-16.76 -9.13)">
